<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Profile Group</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0f172a, #2563eb);
      color: white;
    }
    .card {
      max-width: 760px;
      padding: 48px;
      margin: 24px;
      border-radius: 24px;
      background: rgba(255,255,255,0.1);
      box-shadow: 0 20px 60px rgba(0,0,0,0.25);
      backdrop-filter: blur(12px);
      text-align: center;
    }
    h1 {
      font-size: 48px;
      margin: 0 0 16px;
    }
    p {
      font-size: 20px;
      line-height: 1.6;
      opacity: 0.92;
    }
    .note {
      margin-top: 28px;
      font-size: 15px;
      opacity: 0.75;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Profile Group</h1>
    <p>Welcome to Profile Group.</p>
    <p>Our internal platform is available only through the company VPN.</p>
    <div class="note">
      If you are an authorized user, please connect to VPN and reload this page.
    </div>
  </main>
</body>
</html>
